# CircleCI continuation configuration used by .circleci/config.yml.
#
# The frontend and backend parameters are set by the path-filtering setup job.
# A job is skipped when its parameter is false, so unrelated changes do not use build credits.
#
# Changes in this revision:
# - the backend job now runs fmt, clippy, and `cargo test --workspace --locked` serially,
#   reusing one dependency compilation instead of paying for two parallel ones.
# - clippy and test run before the cache save, so new crates compiled for tests stay cached.
# - the frontend job caches the pnpm store; the cache key is bumped when the store layout changes.
# - caches only the cargo registry and git, not target/: caches are billed as size x retention
#   and a debug Tauri target directory would exceed the free storage allowance.
# - `cargo test` was verified locally on Windows: 137 tests pass in ~3s and compilation
#   succeeds without a dist/ directory (generate_context! does not require frontendDist).
#   The Linux test run (cfg(not(windows)) paths) is validated by the first CI run.
#
# References:
# - cimg/rust image and tagging scheme: https://circleci.com/developer/images/image/cimg/rust
# - cimg/node image: https://circleci.com/developer/images/image/cimg/node
# - Configuration reference (docker, caches, workflows): https://circleci.com/docs/configuration-reference/
# - Cache retention and job level `retention`: https://circleci.com/docs/guides/optimize/persist-data/
# - pnpm lockfile version: 9.0, frontend node version: 24.22, rustc version: 1.99.1
# - clippy runs without `-D warnings`: Cargo.toml already denies critical lints, while unwrap_used / expect_used stay at warn.
# - cimg/node ships pnpm under root-owned /usr/local/lib/node_modules, so the global install needs sudo to avoid EACCES.
# - caches are billed as size x retention at save time, so every cache using job keeps retention at 3 days.
# - CircleCI cache keys are immutable, so the prefix is bumped whenever the cached paths change.

version: 2.1

parameters:
  frontend:
    type: boolean
    default: false
  backend:
    type: boolean
    default: false

commands:
  install-pnpm:
    steps:
      - run:
          name: Install pnpm
          command: |
            sudo env "PATH=$PATH" npm install --global pnpm@12
            pnpm --version

  install-tauri-system-deps:
    steps:
      - run:
          name: Install Tauri Linux system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y \
              curl \
              wget \
              file \
              pkg-config \
              libssl-dev \
              libwebkit2gtk-4.1-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              libxdo-dev

  prepare-rust-tooling:
    steps:
      - run:
          name: Prepare rustfmt and clippy
          command: |
            rustup component add rustfmt clippy
            cargo fmt --version
            cargo clippy --version

jobs:
  frontend:
    docker:
      - image: cimg/node:24.22
    resource_class: small
    retention:
      caches: 3d
    steps:
      - checkout
      - install-pnpm
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-v1-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store
      - run:
          name: Type check and build frontend
          command: pnpm build

  backend:
    docker:
      - image: cimg/rust:1.99
    resource_class: medium
    retention:
      caches: 3d
    steps:
      - checkout
      - install-tauri-system-deps
      - prepare-rust-tooling
      - restore_cache:
          keys:
            - cargo-v4-{{ checksum "src-tauri/Cargo.lock" }}
            - cargo-v4-
      - run:
          name: Check formatting
          command: cargo fmt --all --check
          working_directory: src-tauri
      - run:
          name: Run clippy
          command: cargo clippy --workspace --all-targets --locked
          working_directory: src-tauri
      - run:
          name: Run unit tests
          command: cargo test --workspace --locked
          working_directory: src-tauri
      - save_cache:
          key: cargo-v4-{{ checksum "src-tauri/Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git

workflows:
  frontend-checks:
    when: << pipeline.parameters.frontend >>
    jobs:
      - frontend

  backend-checks:
    when: << pipeline.parameters.backend >>
    jobs:
      - backend
