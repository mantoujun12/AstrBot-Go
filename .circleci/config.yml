# References:
# - cimg/rust image and tagging scheme: https://circleci.com/developer/images/image/cimg/rust
# - cimg/node image: https://circleci.com/developer/images/image/cimg/node
# - Configuration reference (docker, caches, approval jobs, workflows): https://circleci.com/docs/configuration-reference/
# - Cache retention and job level `retention`: https://circleci.com/docs/guides/optimize/persist-data/
# - pnpm lockfile version: 9.0, frontend node version: 24.22, rustc version: 1.99.1
# - `dist` is gitignored; the release job runs `pnpm tauri build --no-bundle`, so beforeBuildCommand regenerates it in place.
# - The `-node` variant of cimg/rust provides Node.js for the Tauri CLI; `--no-bundle` skips deb/rpm/AppImage tooling.
# - clippy runs without `-D warnings`: Cargo.toml already denies critical lints, while unwrap_used / expect_used stay at warn.
# - cimg/node ships pnpm under root-owned /usr/local/lib/node_modules, so the global install needs sudo to avoid EACCES.
# - caches are billed as size x retention at save time, so every cache using job keeps retention at 3 days.
# - lint and release use separate cache keys: CircleCI cache keys are immutable, and the release job must not lose its
#   own cache writes to a key already saved by the lint job.
# - release only caches the cargo registry and git db, not `target`, because it runs rarely behind the approval gate.

version: 2.1

commands:
  install-pnpm:
    steps:
      - run:
          name: Install pnpm
          command: |
            sudo env "PATH=$PATH" npm install --global pnpm@12
            pnpm --version

  install-tauri-system-deps:
    steps:
      - run:
          name: Install Tauri Linux system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y \
              curl \
              wget \
              file \
              pkg-config \
              libssl-dev \
              libwebkit2gtk-4.1-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              libxdo-dev

jobs:
  frontend:
    docker:
      - image: cimg/node:24.22
    retention:
      caches: 3d
    steps:
      - checkout
      - install-pnpm
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Type check and build frontend
          command: pnpm build

  lint:
    docker:
      - image: cimg/rust:1.99
    retention:
      caches: 3d
    steps:
      - checkout
      - install-tauri-system-deps
      - run:
          name: Prepare rustfmt and clippy
          command: |
            rustup component add rustfmt clippy
            cargo fmt --version
            cargo clippy --version
      - restore_cache:
          keys:
            - cargo-v3-{{ checksum "src-tauri/Cargo.lock" }}
            - cargo-v3-
      - run:
          name: Check formatting
          command: cargo fmt --all --check
          working_directory: src-tauri
      - run:
          name: Run clippy
          command: cargo clippy --workspace --all-targets --locked
          working_directory: src-tauri
      - save_cache:
          key: cargo-v3-{{ checksum "src-tauri/Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - src-tauri/target

  release:
    docker:
      - image: cimg/rust:1.99-node
    retention:
      caches: 3d
    steps:
      - checkout
      - install-pnpm
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - install-tauri-system-deps
      - restore_cache:
          keys:
            - tauri-release-v3-{{ checksum "src-tauri/Cargo.lock" }}
            - tauri-release-v3-
      - run:
          name: Build release binary without bundling
          command: pnpm tauri build --no-bundle
      - save_cache:
          key: tauri-release-v3-{{ checksum "src-tauri/Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git

workflows:
  build:
    jobs:
      - frontend
      - lint:
          requires:
            - frontend
      - hold:
          type: approval
          requires:
            - lint
      - release:
          requires:
            - hold
