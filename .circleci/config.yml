# CircleCI setup configuration.
#
# This file only detects which parts of the repository changed and continues the pipeline
# with .circleci/continue_config.yml. The actual jobs live in the continuation config.
#
# Path mapping:
# - Frontend changes run the frontend check.
# - Backend changes under src-tauri/ run the backend check.
# - CircleCI configuration changes run both checks.
#
# Documentation:
# - path-filtering orb: https://circleci.com/developer/orbs/orb/circleci/path-filtering
# - Dynamic configuration: https://circleci.com/docs/guides/configuration-reference/#dynamic-configuration

version: 2.1

setup: true

orbs:
  path-filtering: circleci/path-filtering@3.0.0

workflows:
  setup:
    jobs:
      - path-filtering/filter:
          name: filter-paths
          base-revision: main
          config-path: .circleci/continue_config.yml
          mapping: |
            src/.* frontend true
            public/.* frontend true
            index\.html frontend true
            package\.json frontend true
            pnpm-lock\.yaml frontend true
            pnpm-workspace\.yaml frontend true
            vite\.config\.ts frontend true
            tsconfig.*\.json frontend true
            src-tauri/.* backend true
            \.circleci/.* frontend true
            \.circleci/.* backend true
