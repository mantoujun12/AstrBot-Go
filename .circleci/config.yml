# References:
# - cimg/rust image and tagging scheme: https://circleci.com/developer/images/image/cimg/rust
# - cimg/node image: https://circleci.com/developer/images/image/cimg/node
# - Configuration reference (docker, workspaces, caches, workflows): https://circleci.com/docs/configuration-reference/
# - pnpm lockfile version: 9.0, frontend node version: 24.22, rustc version: 1.99.1
# - `dist` is gitignored, so the frontend job persists it to the workspace for tauri-build's frontendDist check.
# - clippy runs without `-D warnings`: Cargo.toml already denies critical lints, while unwrap_used / expect_used stay at warn.
# - cimg/node ships pnpm under root-owned /usr/local/lib/node_modules, so the global install needs sudo to avoid EACCES.

version: 2.1

jobs:
  frontend:
    docker:
      - image: cimg/node:24.22
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: |
            sudo env "PATH=$PATH" npm install --global pnpm@12
            pnpm --version
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Type check and build frontend
          command: pnpm build
      - persist_to_workspace:
          root: .
          paths:
            - dist

  rust:
    docker:
      - image: cimg/rust:1.99
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install Tauri Linux system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y \
              curl \
              wget \
              file \
              pkg-config \
              libssl-dev \
              libwebkit2gtk-4.1-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              libxdo-dev
      - run:
          name: Prepare rustfmt and clippy
          command: |
            rustup component add rustfmt clippy
            cargo fmt --version
            cargo clippy --version
      - restore_cache:
          keys:
            - cargo-v1-{{ checksum "src-tauri/Cargo.lock" }}
            - cargo-v1-
      - run:
          name: Check formatting
          command: cargo fmt --all --check
          working_directory: src-tauri
      - run:
          name: Run clippy
          command: cargo clippy --workspace --all-targets --locked
          working_directory: src-tauri
      - save_cache:
          key: cargo-v1-{{ checksum "src-tauri/Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - src-tauri/target

workflows:
  build:
    jobs:
      - frontend
      - rust:
          requires:
            - frontend
