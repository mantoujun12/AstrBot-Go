name: UI Snapshots

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: "Viewport sizes, for example: 640,480 1280,720 1920,1080"
        required: false
        default: "640,480 960,640 1280,720 1440,900 1920,1080"

permissions:
  contents: read

jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Install Playwright
        run: |
          npm i -g playwright@1
          playwright install --with-deps chromium

      - name: Start preview server
        run: |
          pnpm preview --port 4173 --strictPort --host 127.0.0.1 \
            > preview.log 2>&1 &
          ready=0
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat preview.log
            exit 1
          fi

      - name: Capture screenshots
        env:
          SIZES: ${{ github.event.inputs.sizes }}
        run: |
          mkdir -p shots
          for size in $SIZES; do
            playwright screenshot \
              --viewport-size="$size" \
              --wait-for-timeout=2500 \
              --timeout=30000 \
              "http://127.0.0.1:4173/" \
              "shots/window-${size/,/x}.png"
          done
          ls -l shots

      - uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: shots/*.png
          if-no-files-found: error

  macos-native:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build app bundle
        run: |
          pnpm tauri build --debug \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Set screen resolution
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install displayplacer > /dev/null 2>&1 || true
          if command -v displayplacer > /dev/null 2>&1; then
            displayplacer "res:1920x1080" || displayplacer list || true
          fi

      - name: Launch app and capture window
        run: |
          set -u
          APP="src-tauri/target/debug/bundle/macos/AstrBot Launcher.app"
          test -d "$APP"
          codesign --force --deep --sign - "$APP"
          echo "--- spctl ---"
          spctl -a -vv "$APP" 2>&1 || true
          mkdir -p shots crash
          echo "--- open ---"
          open "$APP" 2>&1 || echo "open failed: $?"
          sleep 20
          echo "--- processes ---"
          if ! pgrep -f astrbot > /dev/null; then
            echo "no astrbot process, trying direct launch"
            "$APP/Contents/MacOS/astrbot-launcher-vue" \
              > app.log 2>&1 &
            sleep 15
            echo "--- app.log ---"
            cat app.log || true
          fi
          echo "--- processes ---"
          pgrep -fl astrbot || echo "no astrbot process"
          echo "--- system log ---"
          log show --last 2m --style compact \
            --predicate 'eventMessage CONTAINS[c] "astrbot"' \
            2>/dev/null | tail -20 || true
          screencapture -x shots/macos-window.png || true
          find ~/Library/Logs/DiagnosticReports -name "*.ips" \
            -mmin -10 -exec cp {} crash/ \; 2>/dev/null || true
          ls -l shots crash
          if [ ! -s shots/macos-window.png ]; then
            echo "screencapture produced no image"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-native
          path: |
            shots/*.png
            crash/*.ips
            app.log
          if-no-files-found: warn

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm tauri build --debug --no-bundle

      - name: Set screen resolution
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;

          public class Disp {
              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              public struct DEVMODE {
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)]
                  public string dmDeviceName;
                  public short dmSpecVersion;
                  public short dmDriverVersion;
                  public short dmSize;
                  public short dmDriverExtra;
                  public int dmFields;
                  public int dmPositionX;
                  public int dmPositionY;
                  public int dmDisplayOrientation;
                  public int dmDisplayFixedOutput;
                  public short dmColor;
                  public short dmDuplex;
                  public short dmYResolution;
                  public short dmTTOption;
                  public short dmCollate;
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)]
                  public string dmFormName;
                  public short dmLogPixels;
                  public int dmBitsPerPel;
                  public int dmPelsWidth;
                  public int dmPelsHeight;
                  public int dmDisplayFlags;
                  public int dmDisplayFrequency;
                  public int dmICMMethod;
                  public int dmICMIntent;
                  public int dmMediaType;
                  public int dmDitherType;
                  public int dmReserved1;
                  public int dmReserved2;
                  public int dmPanningWidth;
                  public int dmPanningHeight;
              }

              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern bool EnumDisplaySettings(
                  string deviceName, int modeNum, ref DEVMODE devMode);

              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern int ChangeDisplaySettings(
                  ref DEVMODE devMode, int flags);

              public static string Apply(int width, int height) {
                  DEVMODE dm = new DEVMODE();
                  dm.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));
                  for (int i = 0;
                       EnumDisplaySettings(null, i, ref dm); i++) {
                      if (dm.dmPelsWidth == width
                          && dm.dmPelsHeight == height) {
                          dm.dmFields = 0x80000 | 0x100000;
                          int r = ChangeDisplaySettings(ref dm, 0);
                          return "result=" + r;
                      }
                  }
                  return "mode not found";
              }
          }
          '@
          [Disp]::Apply(1920, 1080)
          Start-Sleep -Seconds 3
          Add-Type -AssemblyName System.Windows.Forms
          $vs = [System.Windows.Forms.SystemInformation]::VirtualScreen
          Write-Host "screen: $($vs.Width)x$($vs.Height)"

      - name: Launch app and capture screen
        shell: pwsh
        run: |
          $exe = "src-tauri/target/debug/astrbot-launcher-vue.exe"
          if (-not (Test-Path $exe)) { throw "binary not found: $exe" }
          $p = Start-Process -FilePath (Resolve-Path $exe).Path -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "process exited: $($p.ExitCode)" }
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $vs = [System.Windows.Forms.SystemInformation]::VirtualScreen
          Write-Host "screen: $($vs.Width)x$($vs.Height)"
          New-Item -ItemType Directory -Force -Path shots | Out-Null
          $bmp = New-Object System.Drawing.Bitmap $vs.Width, $vs.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($vs.Left, $vs.Top, 0, 0, $bmp.Size)
          $bmp.Save("$PWD\shots\windows-window.png")
          $g.Dispose()
          $bmp.Dispose()
          Get-ChildItem shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native
          path: shots/*.png
          if-no-files-found: warn
