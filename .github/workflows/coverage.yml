name: Coverage

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    name: Vitest coverage and test analytics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for accurate Codecov reports

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One run produces both the lcov coverage report and the JUnit
      # test report for Codecov Test Analytics.
      - name: Run tests with coverage
        run: >-
          pnpm test --coverage
          --reporter=junit --outputFile=test-report.junit.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report-type: test_results
