# Auto Release / 自动发行
#
# Triggers / 触发条件
# - Push to main when paths match: src/**, public/**, src-tauri/**, package.json, pnpm-lock.yaml,
#   vite.config.ts, index.html, tsconfig*.json, changelogs/**.
#   推送到 main，且改动命中上述路径时触发。
# - Manual workflow_dispatch from main.
#   在 main 上手动执行 workflow_dispatch。
#
# Release gate / 发布闸门
# - package.json and src-tauri/tauri.conf.json versions must match.
#   package.json 与 src-tauri/tauri.conf.json 的版本号必须一致。
# - changelogs/v<version>.md must exist with at least one real list entry.
#   changelogs/v<版本号>.md 必须存在且至少包含一条实际列表条目。
# - A version file left in the legacy changelog/ directory fails the job with a rebase instruction.
#   版本文件仍位于旧 changelog/ 目录时会失败，并提示变基。
# - Tag v<version> must not already have a GitHub Release.
#   v<版本号> tag 不能已有 GitHub Release。
# - An existing tag without a release also skips the build and requires manual handling.
#   tag 已存在但没有 Release 时也会跳过构建，需要人工处理。
# A version mismatch or a legacy version file fails the job; a missing changelog or an existing tag skips the build.
# 版本不一致或版本文件仍位于旧目录会直接失败；缺少 changelog 或 tag 已存在时跳过构建。
#
# Security / 安全
# - Third-party actions are pinned to full commit SHAs; update pins deliberately.
#   第三方 action 固定到完整 commit SHA，升级时需人工审核。
# - The build job has read-only contents permission and does not persist checkout credentials.
#   The publish job has contents: write and never runs repository build code.
#   构建任务只有 contents 只读权限且不保留 checkout 凭据；发布任务拥有 contents: write 权限，但不执行仓库构建代码。
# - Immediately before publishing, the tag is re-checked and created atomically so a concurrent
#   tag cannot make the release describe a different commit.
#   发布前会再次校验 tag，并以原子方式创建，避免并发改动导致 Release 与源码不一致。
#
# How to trigger a release / 如何触发一次发布
# 1. During development, add user-facing changes to changelogs/unreleased.md under the Added, Changed,
#    Deprecated, Removed, Fixed, and Security sections. Keep entries short; one pull request yields
#    exactly one logical entry (one English bullet and its matching Chinese bullet), not one per section.
#    Leave entries unannotated until the release pull request.
#    开发过程中，面向用户的改动写入 changelogs/unreleased.md 的“新增”“变更”“弃用”“移除”“修复”“安全”分节。
#    条目应简短；每个 PR 只产生一条逻辑条目（一条英文条目和对应的中文条目），不要按分节拆成多条。
#    开发期间不添加 PR 链接，统一在发版 PR 中补齐。
# 2. When ready to release, create a version update pull request that:
#    - bumps package.json, src-tauri/Cargo.toml, and src-tauri/tauri.conf.json to the release version;
#    - updates src-tauri/Cargo.lock by running cargo check in src-tauri/;
#    - renames changelogs/unreleased.md to changelogs/v<version>.md;
#    - annotates every entry with its source pull request as a full Markdown link, using
#      `([#8](https://github.com/mantoujun12/astrbot-launcher-vue/pull/8))` for English entries and
#      `（[#8](https://github.com/mantoujun12/astrbot-launcher-vue/pull/8)）` for Chinese entries;
#    - recreates an empty changelogs/unreleased.md for the next cycle;
#    - rebases onto the latest main before merging and moves concurrent unreleased entries into
#      the new draft.
#    准备发版时创建版本更新 PR：将 package.json、src-tauri/Cargo.toml、src-tauri/tauri.conf.json 改到发布版本；
#    在 src-tauri/ 下运行 cargo check 更新 src-tauri/Cargo.lock；把 changelogs/unreleased.md 改名为 changelogs/v<版本号>.md，
#    并为每条条目补上来源 PR 的完整 Markdown 链接（英文用半角括号，中文用全角括号）；
#    并新建空的 changelogs/unreleased.md 供下一轮使用。
#    合并前先变基到最新 main，并把并发新增的条目移到新的 changelogs/unreleased.md，留到下一轮发布。
# 3. Merge the version update pull request into main. The workflow builds Windows NSIS/MSI installers
#    in a read-only job, then creates a GitHub Release in a separate job with write access.
#    The release body shows changelogs/v<version>.md first, then GitHub's auto-generated release notes
#    (the same content as the "Generate release notes" button), separated by a horizontal rule.
#    Build failures are retried 2 times (3 attempts total); release note generation, release creation,
#    asset upload, and publishing are retried up to 3 times. If note generation still fails, the
#    release is published with the changelog only.
#    合入 main 后，工作流先在只读任务中构建 Windows NSIS/MSI 安装包，再在拥有写权限的独立任务中创建 GitHub Release；
#    Release 说明先展示 changelogs/v<版本号>.md 的内容，再附上 GitHub 自动生成的发布说明
#    （与“生成 release notes”按钮一致），两者以分隔线隔开。
#    构建失败自动重试 2 次（共 3 次尝试），说明生成、Release 创建、安装包上传与发布最多重试 3 次；
#    说明生成仍然失败时，仅使用 changelog 发布。
# 4. After a release, continue development; the new changelogs/unreleased.md is ready for the next cycle.
#    发版后继续开发，新的 changelogs/unreleased.md 已准备好记录下一轮改动。
#
# References / 参考
# - tauri-action: https://github.com/tauri-apps/tauri-action
# - pnpm/setup: https://github.com/pnpm/setup
# - Semantic Versioning: https://semver.org/
# - Keep a Changelog: https://keepachangelog.com/
# - GitHub Actions workflow syntax: https://docs.github.com/actions/reference/workflows-and-actions/workflow-syntax

name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "index.html"
      - "tsconfig*.json"
      - "changelogs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.meta.outputs.should_release }}
      version: ${{ steps.meta.outputs.version }}
      changelog_body: ${{ steps.meta.outputs.changelog_body }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve release metadata
        id: meta
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require("fs");

            const tauri = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const version = tauri.version;

            core.setOutput("version", version);

            if (pkg.version !== version) {
              core.setFailed(`package.json (${pkg.version}) 与 tauri.conf.json (${version}) 版本不一致`);
              return;
            }

            const changelogPath = `changelogs/v${version}.md`;
            const legacyChangelogPath = `changelog/v${version}.md`;

            if (!fs.existsSync(changelogPath) && fs.existsSync(legacyChangelogPath)) {
              core.setFailed(`发现旧目录 ${legacyChangelogPath}，请变基到最新 main 并将版本文件移动到 ${changelogPath}`);
              return;
            }

            if (!fs.existsSync(changelogPath)) {
              core.notice(`未找到 ${changelogPath}，跳过发布`);
              core.setOutput("should_release", "false");
              return;
            }

            const changelogBody = fs.readFileSync(changelogPath, "utf8").trim();

            // Only real list entries count: ignore headings, rules such as "---", HTML comments,
            // fenced code blocks, and placeholder bullets.
            const entrySource = changelogBody
              .replace(/<!--[\s\S]*?-->/g, "")
              .replace(/```[\s\S]*?```/g, "");
            const hasEntries = entrySource.split(/\r?\n/).some((line) => {
              const text = line.trim();
              return (
                /^[-*+]\s+.*[\p{L}\p{N}]/u.test(text) &&
                !/^[-*+]\s+(?:todo|tbd|tba|待补充|待填写|待定)\s*$/iu.test(text)
              );
            });

            if (!hasEntries) {
              core.notice(`${changelogPath} 还没有实际条目，跳过发布`);
              core.setOutput("should_release", "false");
              return;
            }

            let releaseExists = false;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: `v${version}`,
              });
              releaseExists = true;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            if (releaseExists) {
              core.notice(`v${version} 已有 GitHub Release，跳过发布`);
              core.setOutput("should_release", "false");
              return;
            }

            let tagExists = false;
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/v${version}`,
              });
              tagExists = true;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            if (tagExists) {
              core.notice(`标签 v${version} 已存在但没有 Release，请手动处理后再重试`);
              core.setOutput("should_release", "false");
              return;
            }

            core.setOutput("changelog_body", changelogBody);
            core.setOutput("should_release", "true");

      - name: Setup pnpm and Node
        if: steps.meta.outputs.should_release == 'true'
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Setup Rust
        if: steps.meta.outputs.should_release == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Rust
        if: steps.meta.outputs.should_release == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./src-tauri -> target"

      - name: Build installers
        if: steps.meta.outputs.should_release == 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          retryAttempts: 2
          args: --bundles nsis,msi

      - name: Upload installers
        if: steps.meta.outputs.should_release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installers
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    if: needs.build.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: installers
          path: dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
          CHANGELOG_BODY: ${{ needs.build.outputs.changelog_body }}
        run: |
          set -euo pipefail

          tag="v${VERSION}"
          repo="${GITHUB_REPOSITORY}"

          # This job has no checkout, so gh cannot infer the repository from git.
          # Every gh release command must pass --repo explicitly.
          # 本任务没有 checkout，gh 无法从 git 推断仓库，所有 gh release 命令必须显式指定 --repo。

          release_created=false
          publishing_finished=false
          tag_created_here=false

          cleanup_failed_release() {
            local status=$?
            if [ "${status}" -ne 0 ] && [ "${publishing_finished}" != "true" ]; then
              if [ "${release_created}" = "true" ]; then
                echo "::warning::发布失败，清理本次未完成的草稿 Release 和标签，允许后续重试"
                gh release delete "${tag}" --repo "${repo}" --yes --cleanup-tag || true
              elif [ "${tag_created_here}" = "true" ]; then
                echo "::warning::发布失败，清理本次创建的标签 ${tag}，允许后续重试"
                gh api --method DELETE "repos/${repo}/git/refs/tags/${tag}" >/dev/null 2>&1 || true
              fi
            fi
            exit "${status}"
          }
          trap cleanup_failed_release EXIT

          resolve_tag_sha() {
            local sha type
            sha=$(gh api "repos/${repo}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null) || return 1
            type=$(gh api "repos/${repo}/git/ref/tags/${tag}" --jq '.object.type')
            if [ "${type}" = "tag" ]; then
              sha=$(gh api "repos/${repo}/git/tags/${sha}" --jq '.object.sha')
            fi
            printf '%s' "${sha}"
          }

          # Re-check the tag right before writing: it must be absent or point at the built commit.
          if existing_sha=$(resolve_tag_sha); then
            if [ "${existing_sha}" != "${TARGET_SHA}" ]; then
              echo "::error::标签 ${tag} 指向 ${existing_sha}，与构建提交 ${TARGET_SHA} 不一致，停止发布"
              exit 1
            fi
          else
            # Create the tag atomically so a concurrent creation cannot be silently reused.
            if ! gh api --method POST "repos/${repo}/git/refs" \
              -f "ref=refs/tags/${tag}" -f "sha=${TARGET_SHA}" >/dev/null; then
              if ! existing_sha=$(resolve_tag_sha) || [ "${existing_sha}" != "${TARGET_SHA}" ]; then
                echo "::error::无法将标签 ${tag} 创建到 ${TARGET_SHA}，停止发布"
                exit 1
              fi
            else
              tag_created_here=true
            fi
          fi

          # Compose the release body: the project changelog first, then GitHub's
          # auto-generated release notes. Warnings must stay outside the redirect
          # so they are not written into the release body.
          # 组合 Release 说明：项目 changelog 在前，GitHub 自动生成的说明在后。
          # 警告必须写在重定向之外，避免被写入 Release 正文。

          # Pick the nearest published release that is an ancestor of the built
          # commit. A newer release from another branch must not define the range.
          # 选择构建提交祖先链上最近的已发布 Release，避免其他分支的 Release 影响变更范围。
          resolve_previous_tag() {
            local candidate status
            while IFS= read -r candidate; do
              [ -n "${candidate}" ] || continue
              [ "${candidate}" = "${tag}" ] && continue
              status=$(gh api "repos/${repo}/compare/${candidate}...${TARGET_SHA}" \
                --jq '.status' 2>/dev/null) || continue
              case "${status}" in
                ahead|identical)
                  printf '%s' "${candidate}"
                  return 0
                  ;;
              esac
            done < <(gh release list --repo "${repo}" --exclude-drafts --limit 100 \
              --json tagName --jq '.[].tagName' 2>/dev/null | tr -d '\r')
          }

          # GitHub caps release bodies at 125000 characters; keep a byte margin.
          # 发布说明上限为 125000 字符，这里按字节保留余量。
          body_limit=120000

          # The changelog alone must fit as well; truncate at a UTF-8 boundary.
          # changelog 本身也必须放得下；按 UTF-8 字符边界截断。
          printf '%s\n' "${CHANGELOG_BODY}" > changelog-notes.md
          if [ "$(wc -c < changelog-notes.md | tr -d '[:space:]')" -gt "${body_limit}" ]; then
            echo "::warning::项目 changelog 超出 Release 正文上限，截断后发布"
            size=100000
            while [ "${size}" -gt 0 ]; do
              head -c "${size}" changelog-notes.md > changelog-truncated.md
              if iconv -f UTF-8 -t UTF-8 changelog-truncated.md >/dev/null 2>&1; then
                break
              fi
              size=$((size - 1))
            done
            {
              cat changelog-truncated.md
              printf '\n---\n\n'
              printf '> Changelog truncated to fit the GitHub release body limit.\n'
              printf '> changelog 内容超出 GitHub 发布说明上限，已截断。\n'
            } > changelog-notes.md
          fi

          # The tag already exists, so target_commitish is neither needed nor
          # guaranteed to be accepted by the generate-notes endpoint.
          # tag 已存在，生成说明时不需要 target_commitish，且该接口不保证接受提交 SHA。
          generated_notes=""
          generated_ok=false
          for attempt in 1 2 3; do
            previous_tag=$(resolve_previous_tag)
            generate_args=(-f "tag_name=${tag}")
            if [ -n "${previous_tag}" ]; then
              generate_args+=(-f "previous_tag_name=${previous_tag}")
            fi
            if generated_notes=$(gh api --method POST \
              "repos/${repo}/releases/generate-notes" \
              "${generate_args[@]}" --jq '.body // ""'); then
              # A release published while generating would make the base stale.
              # 生成期间若有新 Release 发布，基线会过期，需要重新生成。
              if [ "$(resolve_previous_tag)" = "${previous_tag}" ]; then
                generated_ok=true
                break
              fi
              echo "::warning::对比基线在生成期间发生变化，重新生成"
              generated_notes=""
              continue
            fi
            generated_notes=""
            echo "::warning::生成自动 Release 说明失败（第 ${attempt} 次），准备重试"
            sleep $((attempt * 10))
          done

          cp changelog-notes.md release-notes.md
          if [ "${generated_ok}" = "true" ] && [ -n "${generated_notes}" ]; then
            {
              cat changelog-notes.md
              printf '\n---\n\n%s\n' "${generated_notes}"
            } > release-notes.md
            if [ "$(wc -c < release-notes.md | tr -d '[:space:]')" -gt "${body_limit}" ]; then
              echo "::warning::Release 说明过长，仅保留项目 changelog"
              cp changelog-notes.md release-notes.md
            fi
          elif [ "${generated_ok}" != "true" ]; then
            echo "::warning::自动 Release 说明生成失败，Release 只包含项目 changelog"
          fi

          # Only reuse a draft. An already published release with this tag was not
          # created by this run, so its curated notes must not be overwritten.
          # 只复用草稿；同 tag 的已发布 Release 不是本次任务创建的，不能覆盖其说明。
          release_created=false
          for attempt in 1 2 3; do
            if gh release create "${tag}" --repo "${repo}" --verify-tag --draft \
              --title "${tag}" --notes-file release-notes.md; then
              release_created=true
              break
            fi
            if existing_draft=$(gh release view "${tag}" --repo "${repo}" \
              --json isDraft --jq '.isDraft' 2>/dev/null); then
              if [ "${existing_draft}" = "true" ]; then
                release_created=true
                break
              fi
              echo "::error::${tag} 已存在已发布的 Release，且不是本次任务创建，停止覆盖"
              exit 1
            fi
            echo "创建 Release 失败（第 ${attempt} 次），准备重试"
            sleep $((attempt * 10))
          done
          if [ "${release_created}" != "true" ]; then
            echo "::error::创建 GitHub Release ${tag} 失败"
            exit 1
          fi

          mapfile -t assets < <(find dist -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.zip' -o -name '*.sig' \) -print)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::下载的构建产物中没有安装包文件"
            exit 1
          fi

          nsis_zip=$(find dist -type f -name '*-setup.nsis.zip' -print | sort | head -n 1)
          msi_zip=$(find dist -type f -name '*.msi.zip' -print | sort | head -n 1)
          if [ -z "${nsis_zip}" ] || [ ! -f "${nsis_zip}.sig" ] || [ -z "${msi_zip}" ] || [ ! -f "${msi_zip}.sig" ]; then
            echo "::error::缺少 Tauri Updater 所需的签名压缩包"
            exit 1
          fi

          uploaded=false
          for attempt in 1 2 3; do
            if gh release upload "${tag}" "${assets[@]}" --repo "${repo}" --clobber; then
              uploaded=true
              break
            fi
            echo "上传安装包失败（第 ${attempt} 次），准备重试"
            sleep $((attempt * 10))
          done
          if [ "${uploaded}" != "true" ]; then
            echo "::error::上传 ${tag} 的安装包失败"
            exit 1
          fi

          nsis_asset=$(basename "${nsis_zip}")
          msi_asset=$(basename "${msi_zip}")
          nsis_signature=$(cat "${nsis_zip}.sig")
          msi_signature=$(cat "${msi_zip}.sig")
          base_url="https://github.com/${repo}/releases/download/${tag}"
          export NSIS_URL="${base_url}/${nsis_asset}"
          export MSI_URL="${base_url}/${msi_asset}"
          export NSIS_SIGNATURE="${nsis_signature}"
          export MSI_SIGNATURE="${msi_signature}"
          export VERSION
          export CHANGELOG_BODY
          node <<'NODE'
          const fs = require("fs");
          const platform = {
            signature: process.env.NSIS_SIGNATURE,
            url: process.env.NSIS_URL,
          };
          const manifest = {
            version: process.env.VERSION,
            notes: process.env.CHANGELOG_BODY,
            pub_date: new Date().toISOString(),
            platforms: {
              "windows-x86_64-nsis": platform,
              "windows-x86_64-msi": {
                signature: process.env.MSI_SIGNATURE,
                url: process.env.MSI_URL,
              },
            },
          };
          fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2));
          NODE

          manifest_uploaded=false
          for attempt in 1 2 3; do
            if gh release upload "${tag}" latest.json --repo "${repo}" --clobber; then
              manifest_uploaded=true
              break
            fi
            echo "上传 latest.json 失败（第 ${attempt} 次），准备重试"
            sleep $((attempt * 10))
          done
          if [ "${manifest_uploaded}" != "true" ]; then
            echo "::error::上传 ${tag} 的 latest.json 失败"
            exit 1
          fi

          # Publish last and re-apply the notes, so a rerun can never publish a
          # draft that carries stale notes. Abort if the release stopped being a
          # draft, so a manually published release keeps its curated notes.
          # 最后发布并重新写入说明，确保重跑不会发布使用旧说明的草稿；
          # 若 Release 已不再是草稿则停止，避免覆盖手动发布的说明。
          if current_draft=$(gh release view "${tag}" --repo "${repo}" \
            --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "${current_draft}" != "true" ]; then
              echo "::error::${tag} 已不再处于草稿状态，停止覆盖其说明"
              exit 1
            fi
          fi

          published=false
          for attempt in 1 2 3; do
            if gh release edit "${tag}" --repo "${repo}" \
              --notes-file release-notes.md --draft=false; then
              published=true
              break
            fi
            # A previous attempt may have published before reporting a failure;
            # re-applying the same notes is idempotent.
            # 上一次尝试可能已发布成功但返回失败，重复写入相同说明是幂等的。
            if is_draft=$(gh release view "${tag}" --repo "${repo}" \
              --json isDraft --jq '.isDraft' 2>/dev/null) && [ "${is_draft}" = "false" ]; then
              published=true
              break
            fi
            echo "发布 Release 失败（第 ${attempt} 次），准备重试"
            sleep $((attempt * 10))
          done
          if [ "${published}" != "true" ]; then
            echo "::error::发布 GitHub Release ${tag} 失败"
            exit 1
          fi
          publishing_finished=true
