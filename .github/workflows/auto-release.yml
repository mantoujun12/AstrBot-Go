# Auto Release / 自动发行
#
# Triggers / 触发条件
# - Push to main when paths match: src/**, public/**, src-tauri/**, package.json, pnpm-lock.yaml,
#   vite.config.ts, index.html, tsconfig*.json, changelog/**.
#   推送到 main，且改动命中上述路径时触发。
# - Manual workflow_dispatch from main.
#   在 main 上手动执行 workflow_dispatch。
#
# Release gate / 发布闸门
# - package.json and src-tauri/tauri.conf.json versions must match.
#   package.json 与 src-tauri/tauri.conf.json 的版本号必须一致。
# - changelog/v<version>.md must exist with real entries.
#   changelog/v<版本号>.md 必须存在且有实际条目。
# - Tag v<version> must not already have a GitHub Release.
#   v<版本号> tag 不能已有 GitHub Release。
# - An existing tag without a release also skips the build and requires manual handling.
#   tag 已存在但没有 Release 时也会跳过构建，需要人工处理。
# A version mismatch fails the job; a missing changelog or an existing tag skips the build.
# 版本不一致会直接失败；缺少 changelog 或 tag 已存在时跳过构建。
#
# How to trigger a release / 如何触发一次发布
# 1. During development, add user-facing changes to changelog/unreleased.md under the Added, Changed,
#    Deprecated, Removed, Fixed, and Security sections.
#    开发过程中，面向用户的改动写入 changelog/unreleased.md 的“新增”“变更”“弃用”“移除”“修复”“安全”分节。
# 2. When ready to release, create a version update pull request that:
#    - bumps package.json, src-tauri/Cargo.toml, and src-tauri/tauri.conf.json to the release version;
#    - updates src-tauri/Cargo.lock by running cargo check in src-tauri/;
#    - renames changelog/unreleased.md to changelog/v<version>.md;
#    - recreates an empty changelog/unreleased.md for the next cycle.
#    准备发版时创建版本更新 PR：将 package.json、src-tauri/Cargo.toml、src-tauri/tauri.conf.json 改到发布版本；
#    在 src-tauri/ 下运行 cargo check 更新 src-tauri/Cargo.lock；把 changelog/unreleased.md 改名为 changelog/v<版本号>.md；
#    并新建空的 changelog/unreleased.md 供下一轮使用。
# 3. Merge the version update pull request into main. The workflow builds Windows NSIS/MSI installers
#    and creates a GitHub Release. Build and upload failures are retried 2 times (3 attempts total).
#    合入 main 后，工作流构建 Windows NSIS/MSI 安装包并创建 GitHub Release；构建与上传失败自动重试 2 次（共 3 次尝试）。
# 4. After a release, continue development; the new changelog/unreleased.md is ready for the next cycle.
#    发版后继续开发，新的 changelog/unreleased.md 已准备好记录下一轮改动。
#
# References / 参考
# - tauri-action: https://github.com/tauri-apps/tauri-action
# - pnpm/setup: https://github.com/pnpm/setup
# - Semantic Versioning: https://semver.org/
# - Keep a Changelog: https://keepachangelog.com/
# - GitHub Actions workflow syntax: https://docs.github.com/actions/reference/workflows-and-actions/workflow-syntax

name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "index.html"
      - "tsconfig*.json"
      - "changelog/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release metadata
        id: meta
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");

            const tauri = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const version = tauri.version;

            core.setOutput("version", version);

            if (pkg.version !== version) {
              core.setFailed(`package.json (${pkg.version}) 与 tauri.conf.json (${version}) 版本不一致`);
              return;
            }

            const changelogPath = `changelog/v${version}.md`;

            if (!fs.existsSync(changelogPath)) {
              core.notice(`未找到 ${changelogPath}，跳过发布`);
              core.setOutput("should_release", "false");
              return;
            }

            const changelogBody = fs.readFileSync(changelogPath, "utf8").trim();
            const hasEntries = changelogBody
              .split(/\r?\n/)
              .some((line) => line.trim() && !line.trim().startsWith("#"));

            if (!hasEntries) {
              core.notice(`${changelogPath} 还没有实际条目，跳过发布`);
              core.setOutput("should_release", "false");
              return;
            }

            let releaseExists = false;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: `v${version}`,
              });
              releaseExists = true;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            if (releaseExists) {
              core.notice(`v${version} 已有 GitHub Release，跳过发布`);
              core.setOutput("should_release", "false");
              return;
            }

            let tagExists = false;
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/v${version}`,
              });
              tagExists = true;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            if (tagExists) {
              core.notice(`标签 v${version} 已存在但没有 Release，请手动处理后再重试`);
              core.setOutput("should_release", "false");
              return;
            }

            core.setOutput("changelog_body", changelogBody);
            core.setOutput("should_release", "true");

      - name: Setup pnpm and Node
        if: steps.meta.outputs.should_release == 'true'
        uses: pnpm/setup@v3.1.2
        with:
          version: 12
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Setup Rust
        if: steps.meta.outputs.should_release == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        if: steps.meta.outputs.should_release == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build and publish
        if: steps.meta.outputs.should_release == 'true'
        uses: tauri-apps/tauri-action@v1
        with:
          tagName: v${{ steps.meta.outputs.version }}
          releaseName: v${{ steps.meta.outputs.version }}
          releaseBody: ${{ steps.meta.outputs.changelog_body }}
          releaseDraft: false
          prerelease: false
          retryAttempts: 2
          args: --bundles nsis,msi
          uploadUpdaterJson: false
          generateReleaseNotes: false
