# Auto Release / 自动发行
#
# Triggers / 触发条件
# - Push to main when paths match: src/**, public/**, src-tauri/**, package.json, pnpm-lock.yaml,
#   vite.config.ts, index.html, tsconfig*.json, changelogs/**.
#   推送到 main，且改动命中上述路径时触发。
# - Manual workflow_dispatch from main.
#   在 main 上手动执行 workflow_dispatch。
#
# Release gate / 发布闸门
# - package.json and src-tauri/tauri.conf.json versions must match.
#   package.json 与 src-tauri/tauri.conf.json 的版本号必须一致。
# - changelogs/v<version>.md must exist with at least one real list entry.
#   changelogs/v<版本号>.md 必须存在且至少包含一条实际列表条目。
# - A version file left in the legacy changelog/ directory fails the job with a rebase instruction.
#   版本文件仍位于旧 changelog/ 目录时会失败，并提示变基。
# - Tag v<version> must not already have a GitHub Release.
#   v<版本号> tag 不能已有 GitHub Release。
# - An existing tag without a release also skips the build and requires manual handling.
#   tag 已存在但没有 Release 时也会跳过构建，需要人工处理。
# A version mismatch or a legacy version file fails the job; a missing changelog or an existing tag skips the build.
# 版本不一致或版本文件仍位于旧目录会直接失败；缺少 changelog 或 tag 已存在时跳过构建。
#
# Build matrix / 构建矩阵
# - Five platforms are built in parallel: Windows x64, Windows ARM64, Linux x64, macOS Apple
#   Silicon, and macOS Intel. Each platform uploads its bundles as installers-<platform>.
#   并行构建五个平台：Windows x64、Windows ARM64、Linux x64、macOS Apple Silicon 与 macOS Intel；
#   每个平台把构建产物上传为 installers-<平台>。
# - The release carries one latest.json updater manifest with every built platform, keyed by
#   Tauri updater targets: windows-x86_64-nsis, windows-x86_64-msi, windows-aarch64-nsis,
#   windows-aarch64-msi, linux-x86_64, darwin-aarch64, and darwin-x86_64.
#   Release 附带唯一的 latest.json 更新清单，按 Tauri Updater 的目标标识列出所有已构建平台：
#   windows-x86_64-nsis、windows-x86_64-msi、windows-aarch64-nsis、windows-aarch64-msi、
#   linux-x86_64、darwin-aarch64 与 darwin-x86_64。
# - macOS bundles are unsigned and unnotarized unless Apple signing secrets are configured, so
#   users must bypass Gatekeeper manually.
#   未配置 Apple 签名密钥时，macOS 安装包不带签名与公证，用户需要手动绕过 Gatekeeper。
#
# Security / 安全
# - Third-party actions are pinned to full commit SHAs; update pins deliberately.
#   第三方 action 固定到完整 commit SHA，升级时需人工审核。
# - The prepare and build jobs have read-only contents permission and do not persist checkout
#   credentials. The publish job has contents: write and never runs repository build code.
#   准备与构建任务只有 contents 只读权限，且不保留 checkout 凭据；
#   发布任务拥有 contents: write 权限，但不执行仓库构建代码。
# - Immediately before publishing, the tag is re-checked and created atomically so a concurrent
#   tag cannot make the release describe a different commit.
#   发布前会再次校验 tag，并以原子方式创建，避免并发改动导致 Release 与源码不一致。
#
# How to trigger a release / 如何触发一次发布
# 1. During development, add user-facing changes to changelogs/unreleased.md under the Added, Changed,
#    Deprecated, Removed, Fixed, and Security sections. Keep entries short; one pull request yields
#    exactly one logical entry (one English bullet and its matching Chinese bullet), not one per section.
#    Leave entries unannotated until the release pull request.
#    开发过程中，面向用户的改动写入 changelogs/unreleased.md 的“新增”“变更”“弃用”“移除”“修复”“安全”分节。
#    条目应简短；每个 PR 只产生一条逻辑条目（一条英文条目和对应的中文条目），不要按分节拆成多条。
#    开发期间不添加 PR 链接，统一在发版 PR 中补齐。
# 2. When ready to release, create a version update pull request that:
#    - bumps package.json, src-tauri/Cargo.toml, and src-tauri/tauri.conf.json to the release version;
#    - updates src-tauri/Cargo.lock by running cargo check in src-tauri/;
#    - renames changelogs/unreleased.md to changelogs/v<version>.md;
#    - annotates every entry with its source pull request as a full Markdown link, using
#      `([#8](https://github.com/mantoujun12/astrbot-launcher-vue/pull/8))` for English entries and
#      `（[#8](https://github.com/mantoujun12/astrbot-launcher-vue/pull/8)）` for Chinese entries;
#    - recreates an empty changelogs/unreleased.md for the next cycle;
#    - rebases onto the latest main before merging and moves concurrent unreleased entries into
#      the new draft.
#    准备发版时创建版本更新 PR：将 package.json、src-tauri/Cargo.toml、src-tauri/tauri.conf.json 改到发布版本；
#    在 src-tauri/ 下运行 cargo check 更新 src-tauri/Cargo.lock；把 changelogs/unreleased.md 改名为 changelogs/v<版本号>.md，
#    并为每条条目补上来源 PR 的完整 Markdown 链接（英文用半角括号，中文用全角括号）；
#    并新建空的 changelogs/unreleased.md 供下一轮使用。
#    合并前先变基到最新 main，并把并发新增的条目移到新的 changelogs/unreleased.md，留到下一轮发布。
# 3. Merge the version update pull request into main. A read-only prepare job resolves the release
#    metadata, then the build matrix produces the Windows x64, Windows ARM64, Linux x64, macOS Apple
#    Silicon, and macOS Intel installers in parallel. A separate job with write access creates the
#    GitHub Release, uploads every installer, and generates a single multi-platform latest.json
#    updater manifest before publishing the release last.
#    The release body shows changelogs/v<version>.md first, then GitHub's auto-generated release notes
#    (the same content as the "Generate release notes" button), separated by a horizontal rule.
#    Build failures are retried 2 times (3 attempts total); release note generation, release creation,
#    asset upload, and publishing are retried up to 3 times. If note generation still fails, the
#    release is published with the changelog only.
#    合入 main 后，只读的准备任务先解析发布元数据，构建矩阵随后并行产出 Windows x64、Windows ARM64、
#    Linux x64、macOS Apple Silicon 与 macOS Intel 安装包；拥有写权限的独立任务创建 GitHub Release，
#    上传全部安装包，并在最后发布前生成唯一的跨平台 latest.json 更新清单。
#    Release 说明先展示 changelogs/v<版本号>.md 的内容，再附上 GitHub 自动生成的发布说明
#    （与“生成 release notes”按钮一致），两者以分隔线隔开。
#    构建失败自动重试 2 次（共 3 次尝试），说明生成、Release 创建、安装包上传与发布最多重试 3 次；
#    说明生成仍然失败时，仅使用 changelog 发布。
# 4. After a release, continue development; the new changelogs/unreleased.md is ready for the next cycle.
#    发版后继续开发，新的 changelogs/unreleased.md 已准备好记录下一轮改动。
#
# References / 参考
# - tauri-action: https://github.com/tauri-apps/tauri-action
# - pnpm/setup: https://github.com/pnpm/setup
# - Semantic Versioning: https://semver.org/
# - Keep a Changelog: https://keepachangelog.com/
# - GitHub Actions workflow syntax: https://docs.github.com/actions/reference/workflows-and-actions/workflow-syntax

name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/auto-release.yml"
      - "src/**"
      - "public/**"
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "index.html"
      - "tsconfig*.json"
      - "changelogs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.meta.outputs.should_release }}
      version: ${{ steps.meta.outputs.version }}
      changelog_body: ${{ steps.meta.outputs.changelog_body }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve release metadata
        id: meta
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require("fs");

            const tauri = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const version = tauri.version;

            core.setOutput("version", version);

            if (pkg.version !== version) {
              core.setFailed(`package.json (${pkg.version}) 与 tauri.conf.json (${version}) 版本不一致`);
              return;
            }

            const changelogPath = `changelogs/v${version}.md`;
            const legacyChangelogPath = `changelog/v${version}.md`;

            if (!fs.existsSync(changelogPath) && fs.existsSync(legacyChangelogPath)) {
              core.setFailed(`发现旧目录 ${legacyChangelogPath}，请变基到最新 main 并将版本文件移动到 ${changelogPath}`);
              return;
            }

            if (!fs.existsSync(changelogPath)) {
              core.notice(`未找到 ${changelogPath}，跳过发布`);
              core.setOutput("should_release", "false");
              return;
            }

            const changelogBody = fs.readFileSync(changelogPath, "utf8").trim();

            // Only real list entries count: ignore headings, rules such as "---", HTML comments,
            // fenced code blocks, and placeholder bullets.
            const entrySource = changelogBody
              .replace(/<!--[\s\S]*?-->/g, "")
              .replace(/```[\s\S]*?```/g, "");
            const hasEntries = entrySource.split(/\r?\n/).some((line) => {
              const text = line.trim();
              return (
                /^[-*+]\s+.*[\p{L}\p{N}]/u.test(text) &&
                !/^[-*+]\s+(?:todo|tbd|tba|待补充|待填写|待定)\s*$/iu.test(text)
              );
            });

            if (!hasEntries) {
              core.notice(`${changelogPath} 还没有实际条目，跳过发布`);
              core.setOutput("should_release", "false");
              return;
            }

            let releaseExists = false;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: `v${version}`,
              });
              releaseExists = true;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            if (releaseExists) {
              core.notice(`v${version} 已有 GitHub Release，跳过发布`);
              core.setOutput("should_release", "false");
              return;
            }

            let tagExists = false;
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/v${version}`,
              });
              tagExists = true;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            if (tagExists) {
              core.notice(`标签 v${version} 已存在但没有 Release，请手动处理后再重试`);
              core.setOutput("should_release", "false");
              return;
            }

            core.setOutput("changelog_body", changelogBody);
            core.setOutput("should_release", "true");

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            artifact: installers-windows-x64
            rust_targets: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc --bundles nsis,msi"
            bundle_paths: |
              src-tauri/target/**/release/bundle/nsis/*
              src-tauri/target/**/release/bundle/msi/*
          - platform: windows-arm64
            os: windows-11-arm
            artifact: installers-windows-arm64
            rust_targets: aarch64-pc-windows-msvc
            args: "--target aarch64-pc-windows-msvc --bundles nsis,msi"
            bundle_paths: |
              src-tauri/target/**/release/bundle/nsis/*
              src-tauri/target/**/release/bundle/msi/*
          - platform: linux-x64
            os: ubuntu-22.04
            artifact: installers-linux-x64
            rust_targets: ""
            args: "--bundles appimage,deb"
            bundle_paths: |
              src-tauri/target/**/release/bundle/appimage/*
              src-tauri/target/**/release/bundle/deb/*
          - platform: macos-arm64
            os: macos-15
            artifact: installers-macos-arm64
            rust_targets: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            bundle_paths: |
              src-tauri/target/**/release/bundle/dmg/*
              src-tauri/target/**/release/bundle/macos/*.tar.gz
              src-tauri/target/**/release/bundle/macos/*.tar.gz.sig
          - platform: macos-x64
            os: macos-15-intel
            artifact: installers-macos-x64
            rust_targets: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --bundles app,dmg"
            bundle_paths: |
              src-tauri/target/**/release/bundle/dmg/*
              src-tauri/target/**/release/bundle/macos/*.tar.gz
              src-tauri/target/**/release/bundle/macos/*.tar.gz.sig
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./src-tauri -> target"
          # Cross-target builds share the runner OS in the default key, so keep one cache per platform.
          # 交叉编译时默认缓存键只包含运行器系统，这里按平台区分缓存。
          key: ${{ matrix.platform }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential \
            libssl-dev \
            file \
            wget

      - name: Build installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          retryAttempts: 2
          args: ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_paths }}
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          # Keep each platform in its own dist/installers-<platform> directory so the
          # architectures can be resolved separately.
          # 每个平台保留独立的 dist/installers-<平台> 目录，便于按架构分别解析产物。
          pattern: installers-*
          merge-multiple: false
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
          CHANGELOG_BODY: ${{ needs.prepare.outputs.changelog_body }}
        run: |
          set -euo pipefail

          tag="v${VERSION}"
          repo="${GITHUB_REPOSITORY}"

          # This job has no checkout, so gh cannot infer the repository from git.
          # Every gh release command must pass --repo explicitly.
          # 本任务没有 checkout，gh 无法从 git 推断仓库，所有 gh release 命令必须显式指定 --repo。

          release_created=false
          publishing_finished=false
          tag_created_here=false

          cleanup_failed_release() {
            local status=$?
            if [ "${status}" -ne 0 ] && [ "${publishing_finished}" != "true" ]; then
              if [ "${release_created}" = "true" ]; then
                echo "::warning::发布失败，清理本次未完成的草稿 Release 和标签，允许后续重试"
                gh release delete "${tag}" --repo "${repo}" --yes --cleanup-tag || true
              elif [ "${tag_created_here}" = "true" ]; then
                echo "::warning::发布失败，清理本次创建的标签 ${tag}，允许后续重试"
                gh api --method DELETE "repos/${repo}/git/refs/tags/${tag}" >/dev/null 2>&1 || true
              fi
            fi
            exit "${status}"
          }
          trap cleanup_failed_release EXIT

          resolve_tag_sha() {
            local sha type
            sha=$(gh api "repos/${repo}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null) || return 1
            type=$(gh api "repos/${repo}/git/ref/tags/${tag}" --jq '.object.type')
            if [ "${type}" = "tag" ]; then
              sha=$(gh api "repos/${repo}/git/tags/${sha}" --jq '.object.sha')
            fi
            printf '%s' "${sha}"
          }

          # Re-check the tag right before writing: it must be absent or point at the built commit.
          if existing_sha=$(resolve_tag_sha); then
            if [ "${existing_sha}" != "${TARGET_SHA}" ]; then
              echo "::error::标签 ${tag} 指向 ${existing_sha}，与构建提交 ${TARGET_SHA} 不一致，停止发布"
              exit 1
            fi
          else
            # Create the tag atomically so a concurrent creation cannot be silently reused.
            if ! gh api --method POST "repos/${repo}/git/refs" \
              -f "ref=refs/tags/${tag}" -f "sha=${TARGET_SHA}" >/dev/null; then
              if ! existing_sha=$(resolve_tag_sha) || [ "${existing_sha}" != "${TARGET_SHA}" ]; then
                echo "::error::无法将标签 ${tag} 创建到 ${TARGET_SHA}，停止发布"
                exit 1
              fi
            else
              tag_created_here=true
            fi
          fi

          # Compose the release body: the project changelog first, then GitHub's
          # auto-generated release notes. Warnings must stay outside the redirect
          # so they are not written into the release body.
          # 组合 Release 说明：项目 changelog 在前，GitHub 自动生成的说明在后。
          # 警告必须写在重定向之外，避免被写入 Release 正文。

          # Pick the nearest published release that is an ancestor of the built
          # commit. A newer release from another branch must not define the range.
          # 选择构建提交祖先链上最近的已发布 Release，避免其他分支的 Release 影响变更范围。
          resolve_previous_tag() {
            local candidate status
            while IFS= read -r candidate; do
              [ -n "${candidate}" ] || continue
              [ "${candidate}" = "${tag}" ] && continue
              status=$(gh api "repos/${repo}/compare/${candidate}...${TARGET_SHA}" \
                --jq '.status' 2>/dev/null) || continue
              case "${status}" in
                ahead|identical)
                  printf '%s' "${candidate}"
                  return 0
                  ;;
              esac
            done < <(gh release list --repo "${repo}" --exclude-drafts --limit 100 \
              --json tagName --jq '.[].tagName' 2>/dev/null | tr -d '\r')
          }

          # GitHub caps release bodies at 125000 characters; keep a byte margin.
          # 发布说明上限为 125000 字符，这里按字节保留余量。
          body_limit=120000

          # The changelog alone must fit as well; truncate at a UTF-8 boundary.
          # changelog 本身也必须放得下；按 UTF-8 字符边界截断。
          printf '%s\n' "${CHANGELOG_BODY}" > changelog-notes.md
          if [ "$(wc -c < changelog-notes.md | tr -d '[:space:]')" -gt "${body_limit}" ]; then
            echo "::warning::项目 changelog 超出 Release 正文上限，截断后发布"
            size=100000
            while [ "${size}" -gt 0 ]; do
              head -c "${size}" changelog-notes.md > changelog-truncated.md
              if iconv -f UTF-8 -t UTF-8 changelog-truncated.md >/dev/null 2>&1; then
                break
              fi
              size=$((size - 1))
            done
            {
              cat changelog-truncated.md
              printf '\n---\n\n'
              printf '> Changelog truncated to fit the GitHub release body limit.\n'
              printf '> changelog 内容超出 GitHub 发布说明上限，已截断。\n'
            } > changelog-notes.md
          fi

          # The tag already exists, so target_commitish is neither needed nor
          # guaranteed to be accepted by the generate-notes endpoint.
          # tag 已存在，生成说明时不需要 target_commitish，且该接口不保证接受提交 SHA。
          generated_notes=""
          generated_ok=false
          for attempt in 1 2 3; do
            previous_tag=$(resolve_previous_tag)
            generate_args=(-f "tag_name=${tag}")
            if [ -n "${previous_tag}" ]; then
              generate_args+=(-f "previous_tag_name=${previous_tag}")
            fi
            if generated_notes=$(gh api --method POST \
              "repos/${repo}/releases/generate-notes" \
              "${generate_args[@]}" --jq '.body // ""'); then
              # A release published while generating would make the base stale.
              # 生成期间若有新 Release 发布，基线会过期，需要重新生成。
              if [ "$(resolve_previous_tag)" = "${previous_tag}" ]; then
                generated_ok=true
                break
              fi
              echo "::warning::对比基线在生成期间发生变化，重新生成"
              generated_notes=""
              continue
            fi
            generated_notes=""
            echo "::warning::生成自动 Release 说明失败（第 ${attempt} 次），准备重试"
            sleep $((attempt * 10))
          done

          cp changelog-notes.md release-notes.md
          if [ "${generated_ok}" = "true" ] && [ -n "${generated_notes}" ]; then
            {
              cat changelog-notes.md
              printf '\n---\n\n%s\n' "${generated_notes}"
            } > release-notes.md
            if [ "$(wc -c < release-notes.md | tr -d '[:space:]')" -gt "${body_limit}" ]; then
              echo "::warning::Release 说明过长，仅保留项目 changelog"
              cp changelog-notes.md release-notes.md
            fi
          elif [ "${generated_ok}" != "true" ]; then
            echo "::warning::自动 Release 说明生成失败，Release 只包含项目 changelog"
          fi

          # Only reuse a draft. An already published release with this tag was not
          # created by this run, so its curated notes must not be overwritten.
          # 只复用草稿；同 tag 的已发布 Release 不是本次任务创建的，不能覆盖其说明。
          release_created=false
          for attempt in 1 2 3; do
            if gh release create "${tag}" --repo "${repo}" --verify-tag --draft \
              --title "${tag}" --notes-file release-notes.md; then
              release_created=true
              break
            fi
            if existing_draft=$(gh release view "${tag}" --repo "${repo}" \
              --json isDraft --jq '.isDraft' 2>/dev/null); then
              if [ "${existing_draft}" = "true" ]; then
                release_created=true
                break
              fi
              echo "::error::${tag} 已存在已发布的 Release，且不是本次任务创建，停止覆盖"
              exit 1
            fi
            echo "创建 Release 失败（第 ${attempt} 次），准备重试"
            sleep $((attempt * 10))
          done
          if [ "${release_created}" != "true" ]; then
            echo "::error::创建 GitHub Release ${tag} 失败"
            exit 1
          fi

          # macOS updater bundles are named after the product only, so the Apple Silicon
          # and Intel builds would collide on the release. Rename each one to include its
          # architecture before uploading.
          # macOS 更新包只按产品名命名，Apple Silicon 与 Intel 构建在 Release 上会重名，
          # 因此上传前重命名并带上架构。
          rename_macos_updater_assets() {
            local dir="$1" arch="$2" asset base renamed
            [ -d "${dir}" ] || return 0
            while IFS= read -r asset; do
              [ -n "${asset}" ] || continue
              # Skip bundles already renamed for this architecture so repeated runs stay identical.
              # 已按本架构重命名的更新包直接跳过，保证重复执行结果一致。
              case "$(basename "${asset}")" in
                *"_${arch}.app.tar.gz") continue ;;
              esac
              # Sanitize the product name into an asset-safe slug; the leading printf
              # strips the newline so tr cannot turn it into a trailing dash.
              # 把产品名转换为可用于资产名的短名；外层 printf 会去掉换行，避免 tr 把它变成多余的连字符。
              base=$(printf '%s' "$(basename "${asset}" .app.tar.gz)" | tr -c 'A-Za-z0-9._-' '-')
              renamed="$(dirname "${asset}")/${base}_${VERSION}_${arch}.app.tar.gz"
              mv "${asset}" "${renamed}"
              if [ -s "${asset}.sig" ]; then
                mv "${asset}.sig" "${renamed}.sig"
              fi
            done < <(find "${dir}" -type f -name '*.app.tar.gz' -print)
          }

          rename_macos_updater_assets "dist/installers-macos-arm64" "aarch64"
          rename_macos_updater_assets "dist/installers-macos-x64" "x86_64"

          # Each platform lives in its own artifact directory, so resolving by directory
          # keeps the architectures apart.
          # 每个平台的产物位于独立目录，按目录解析可避免不同架构互相混淆。
          resolve_signed_update_asset() {
            local dir="$1"
            shift
            local pattern asset
            [ -d "${dir}" ] || return 1
            for pattern in "$@"; do
              while IFS= read -r asset; do
                [ -n "${asset}" ] || continue
                if [ -s "${asset}.sig" ]; then
                  printf '%s' "${asset}"
                  return 0
                fi
              done < <(find "${dir}" -type f -name "${pattern}" -print | sort)
            done
            return 1
          }

          # Tauri can sign the installer directly or emit a ZIP updater bundle,
          # depending on the bundler version and artifact mode.
          # Tauri 可能直接签名安装包，也可能生成 ZIP 更新包，取决于打包器版本与产物模式。
          nsis_x64=$(resolve_signed_update_asset "dist/installers-windows-x64" '*-setup.nsis.zip' '*-setup.exe.zip' '*-setup.exe') || true
          msi_x64=$(resolve_signed_update_asset "dist/installers-windows-x64" '*.msi.zip' '*.msi') || true
          nsis_arm64=$(resolve_signed_update_asset "dist/installers-windows-arm64" '*-setup.nsis.zip' '*-setup.exe.zip' '*-setup.exe') || true
          msi_arm64=$(resolve_signed_update_asset "dist/installers-windows-arm64" '*.msi.zip' '*.msi') || true
          linux_update=$(resolve_signed_update_asset "dist/installers-linux-x64" '*.AppImage.tar.gz' '*.AppImage') || true
          darwin_arm64=$(resolve_signed_update_asset "dist/installers-macos-arm64" '*.app.tar.gz') || true
          darwin_x64=$(resolve_signed_update_asset "dist/installers-macos-x64" '*.app.tar.gz') || true

          if [ -z "${nsis_x64}" ] || [ -z "${msi_x64}" ]; then
            echo "::error::缺少 Tauri Updater 所需的 Windows x64 已签名 NSIS 或 MSI 更新包"
            exit 1
          fi
          if [ -z "${nsis_arm64}" ]; then
            echo "::error::缺少 Tauri Updater 所需的 Windows ARM64 已签名 NSIS 更新包"
            exit 1
          fi
          if [ -z "${linux_update}" ]; then
            echo "::error::缺少 Tauri Updater 所需的 Linux 已签名 AppImage 更新包"
            exit 1
          fi
          if [ -z "${darwin_arm64}" ] || [ -z "${darwin_x64}" ]; then
            echo "::error::缺少 Tauri Updater 所需的 macOS 已签名 app 更新包"
            exit 1
          fi

          mapfile -t assets < <(find dist -type f \( \
            -name '*.exe' -o \
            -name '*.msi' -o \
            -name '*.zip' -o \
            -name '*.AppImage' -o \
            -name '*.AppImage.tar.gz' -o \
            -name '*.deb' -o \
            -name '*.dmg' -o \
            -name '*.app.tar.gz' -o \
            -name '*.sig' \
            \) -print)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::下载的构建产物中没有安装包文件"
            exit 1
          fi

          uploaded=false
          for attempt in 1 2 3; do
            if gh release upload "${tag}" "${assets[@]}" --repo "${repo}" --clobber; then
              uploaded=true
              break
            fi
            echo "上传安装包失败（第 ${attempt} 次），准备重试"
            sleep $((attempt * 10))
          done
          if [ "${uploaded}" != "true" ]; then
            echo "::error::上传 ${tag} 的安装包失败"
            exit 1
          fi

          release_assets=$(gh release view "${tag}" --repo "${repo}" --json assets --jq '.assets[].name')
          if [ -z "${release_assets}" ]; then
            echo "::error::无法读取 ${tag} 已上传的资产列表"
            exit 1
          fi

          # GitHub rewrites asset names that contain spaces or other special characters,
          # so the download URL must use the uploaded asset name instead of the local file name.
          # GitHub 会改写含空格等特殊字符的资产名，因此下载地址必须使用上传后的资产名，而不是本地文件名。
          uploaded_asset_name() {
            local local_name="$1" fallback_pattern="$2" sanitized_name matched
            sanitized_name=$(printf '%s' "${local_name}" | tr -c 'A-Za-z0-9._-' '.')
            matched=$(printf '%s\n' "${release_assets}" | grep -Fx -- "${sanitized_name}" | head -n 1 || true)
            if [ -z "${matched}" ]; then
              matched=$(printf '%s\n' "${release_assets}" | grep -Fx -- "${local_name}" | head -n 1 || true)
            fi
            if [ -z "${matched}" ]; then
              matched=$(printf '%s\n' "${release_assets}" | grep -E -- "${fallback_pattern}" | head -n 1 || true)
            fi
            printf '%s' "${matched}"
          }

          nsis_x64_asset=$(uploaded_asset_name "$(basename "${nsis_x64}")" 'x64.*setup\.(exe|exe\.zip|nsis\.zip)$')
          msi_x64_asset=$(uploaded_asset_name "$(basename "${msi_x64}")" 'x64.*\.msi(\.zip)?$')
          nsis_arm64_asset=$(uploaded_asset_name "$(basename "${nsis_arm64}")" 'arm64.*setup\.(exe|exe\.zip|nsis\.zip)$')
          msi_arm64_asset=""
          if [ -n "${msi_arm64}" ]; then
            msi_arm64_asset=$(uploaded_asset_name "$(basename "${msi_arm64}")" 'arm64.*\.msi(\.zip)?$')
          fi
          linux_asset=$(uploaded_asset_name "$(basename "${linux_update}")" 'amd64\.AppImage(\.tar\.gz)?$')
          darwin_arm64_asset=$(uploaded_asset_name "$(basename "${darwin_arm64}")" 'aarch64\.app\.tar\.gz$')
          darwin_x64_asset=$(uploaded_asset_name "$(basename "${darwin_x64}")" 'x86_64\.app\.tar\.gz$')

          # Build one latest.json entry per platform. The manifest is keyed by Tauri updater
          # targets: `{os}-{arch}-{bundle_type}`, with `{os}-{arch}` as the fallback the
          # updater tries next.
          # 为每个平台生成一条 latest.json 记录；清单以 Tauri Updater 的目标标识为键：
          # `{系统}-{架构}-{安装包类型}`，其回退值为 `{系统}-{架构}`。
          platform_entries="platform-entries.tsv"
          : > "${platform_entries}"

          add_platform_entry() {
            local key="$1" asset_path="$2" asset_name="$3"
            if [ -z "${asset_path}" ] || [ -z "${asset_name}" ]; then
              echo "::error::无法在 ${tag} 中找到 ${key} 对应的已上传更新包"
              exit 1
            fi
            printf '%s\t%s\t%s\n' "${key}" "${asset_name}" "${asset_path}.sig" \
              >> "${platform_entries}"
          }

          add_platform_entry "windows-x86_64-nsis" "${nsis_x64}" "${nsis_x64_asset}"
          add_platform_entry "windows-x86_64-msi" "${msi_x64}" "${msi_x64_asset}"
          add_platform_entry "windows-aarch64-nsis" "${nsis_arm64}" "${nsis_arm64_asset}"
          if [ -n "${msi_arm64}" ]; then
            add_platform_entry "windows-aarch64-msi" "${msi_arm64}" "${msi_arm64_asset}"
          fi
          add_platform_entry "linux-x86_64" "${linux_update}" "${linux_asset}"
          add_platform_entry "darwin-aarch64" "${darwin_arm64}" "${darwin_arm64_asset}"
          add_platform_entry "darwin-x86_64" "${darwin_x64}" "${darwin_x64_asset}"

          required_platforms=(
            "windows-x86_64-nsis"
            "windows-x86_64-msi"
            "windows-aarch64-nsis"
            "linux-x86_64"
            "darwin-aarch64"
            "darwin-x86_64"
          )
          if [ -n "${msi_arm64}" ]; then
            required_platforms+=("windows-aarch64-msi")
          fi

          export REPO="${repo}"
          export TAG="${tag}"
          export VERSION
          export CHANGELOG_BODY
          export REQUIRED_PLATFORMS="${required_platforms[*]}"
          node <<'NODE'
          const fs = require("fs");

          const baseUrl = `https://github.com/${process.env.REPO}/releases/download/${process.env.TAG}`;
          const rows = fs
            .readFileSync("platform-entries.tsv", "utf8")
            .split(/\r?\n/)
            .filter((line) => line.trim() !== "");

          const platforms = {};
          for (const row of rows) {
            const [key, assetName, signaturePath] = row.split("\t");
            if (!key || !assetName || !signaturePath) {
              console.log(`::error::平台条目格式错误：${row}`);
              process.exit(1);
            }
            platforms[key] = {
              signature: fs.readFileSync(signaturePath, "utf8").trim(),
              url: `${baseUrl}/${assetName}`,
            };
          }

          const required = (process.env.REQUIRED_PLATFORMS || "")
            .split(/\s+/)
            .filter((key) => key !== "");
          const missing = required.filter((key) => !(key in platforms));
          if (missing.length > 0) {
            console.log(`::error::latest.json 缺少必需平台：${missing.join(", ")}`);
            process.exit(1);
          }

          const manifest = {
            version: process.env.VERSION,
            notes: process.env.CHANGELOG_BODY,
            pub_date: new Date().toISOString(),
            platforms,
          };
          fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2));
          console.log(`latest.json 已生成，包含 ${Object.keys(platforms).length} 个平台`);
          NODE

          manifest_uploaded=false
          for attempt in 1 2 3; do
            if gh release upload "${tag}" latest.json --repo "${repo}" --clobber; then
              manifest_uploaded=true
              break
            fi
            echo "上传 latest.json 失败（第 ${attempt} 次），准备重试"
            sleep $((attempt * 10))
          done
          if [ "${manifest_uploaded}" != "true" ]; then
            echo "::error::上传 ${tag} 的 latest.json 失败"
            exit 1
          fi

          # Publish last and re-apply the notes, so a rerun can never publish a
          # draft that carries stale notes. Abort if the release stopped being a
          # draft, so a manually published release keeps its curated notes.
          # 最后发布并重新写入说明，确保重跑不会发布使用旧说明的草稿；
          # 若 Release 已不再是草稿则停止，避免覆盖手动发布的说明。
          if current_draft=$(gh release view "${tag}" --repo "${repo}" \
            --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "${current_draft}" != "true" ]; then
              echo "::error::${tag} 已不再处于草稿状态，停止覆盖其说明"
              exit 1
            fi
          fi

          published=false
          for attempt in 1 2 3; do
            if gh release edit "${tag}" --repo "${repo}" \
              --notes-file release-notes.md --draft=false; then
              published=true
              break
            fi
            # A previous attempt may have published before reporting a failure;
            # re-applying the same notes is idempotent.
            # 上一次尝试可能已发布成功但返回失败，重复写入相同说明是幂等的。
            if is_draft=$(gh release view "${tag}" --repo "${repo}" \
              --json isDraft --jq '.isDraft' 2>/dev/null) && [ "${is_draft}" = "false" ]; then
              published=true
              break
            fi
            echo "发布 Release 失败（第 ${attempt} 次），准备重试"
            sleep $((attempt * 10))
          done
          if [ "${published}" != "true" ]; then
            echo "::error::发布 GitHub Release ${tag} 失败"
            exit 1
          fi
          publishing_finished=true
