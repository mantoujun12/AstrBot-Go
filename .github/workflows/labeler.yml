name: Pull Request Labeler

# pull_request_target is required here: pull requests opened from forks must be
# labeled, but the pull_request event only receives a read-only GITHUB_TOKEN in
# that case, so labeling would fail.
# https://docs.github.com/actions/reference/security/securely-using-pull_request_target
#
# Security invariant: this workflow never checks out, downloads, or executes
# pull request code. It only reads .github/labeler.yml from the base branch and
# calls the labels API. Do not add a checkout of
# github.event.pull_request.head.sha, a repository: <fork> input, or any run
# step that consumes pull request content. Any of those turns this into a
# "pwn request" with write access to the base repository.
#
# GitHub's default Actions event policy blocks pull_request_target. Two things
# are needed outside this file: an explicit event policy allowing the event in
# repository settings, and this workflow staying free of pull request code
# execution.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read # read .github/labeler.yml from the base branch
  pull-requests: write # apply labels

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          sync-labels: true
