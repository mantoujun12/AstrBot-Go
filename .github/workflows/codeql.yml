# CodeQL / 代码扫描
#
# 使用高级设置（advanced setup）替代默认设置：只有代码相关路径发生变更时才会扫描，
# 文档、Issue 模板等改动不再触发分析。
# Uses advanced setup instead of default setup: analysis only runs when code paths change,
# so documentation and issue-template edits no longer trigger a scan.
#
# 触发 / Triggers
# - 推送到 main 或向 main 提交 PR，且改动命中下方 paths。
# - 每月一次定时全量扫描（用于捕获新增查询与上游依赖问题）。
# - 支持手动执行 workflow_dispatch。
# - Push/PR to main matching the paths below, a monthly scheduled full scan,
#   and manual workflow_dispatch.
#
# 注意 / Notes
# - 启用本工作流前，需要在仓库 Settings > Code security 中关闭 CodeQL 默认设置，
#   否则默认设置与本工作流会冲突。
# - CodeQL 每次运行仍会分析完整的代码库，paths 过滤只减少运行次数，不能只扫描改动的文件。
# - Disable CodeQL default setup in repository settings before enabling this workflow,
#   otherwise the two setups conflict.
# - Each run still analyzes the whole codebase; path filters only reduce run count.

name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "**/action.yml"
      - "**/action.yaml"
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "tsconfig*.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "**/action.yml"
      - "**/action.yaml"
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "tsconfig*.json"
  schedule:
    # 每月 1 日 18:00 UTC（北京时间次日 02:00）/ Monthly on the 1st at 18:00 UTC.
    - cron: "0 18 1 * *"
  workflow_dispatch:

permissions:
  contents: read

# 不要取消进行中的扫描 / Do not cancel runs that are already in progress.
#
# Rust 分析（windows-latest）耗时约 15 分钟，另外两种语言约 1 分钟。此前对 PR
# 事件启用 cancel-in-progress，导致同一 PR 的新提交会打断尚在运行的 rust 任务，
# 该矩阵项永远不会上传 SARIF，于是 PR 检查报出：
#   code scanning cannot determine the alerts introduced by this pull request,
#   because 1 configuration present on refs/heads/main was not found: /language:rust
# 设为 false 后同组任务串行：正在运行的任务会跑完并上传 SARIF，仅排队中的旧任务会被
# 取消（未启动即取消，不会产生缺失的配置）。
# Rust analysis dominates the runtime (~15 min vs ~1 min for the other languages).
# With cancellation enabled, a new push to the same PR killed the in-flight rust job
# before its SARIF upload, which made the PR check report the missing
# /language:rust configuration. With false, an in-progress run always finishes and
# only still-queued (never started) runs are dropped.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            os: ubuntu-latest
            build-mode: none
          - language: javascript-typescript
            os: ubuntu-latest
            build-mode: none
          - language: rust
            os: windows-latest
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: "/language:${{ matrix.language }}"