enhancement:
  - head-branch: ['^feat', 'feat']

bug:
  - head-branch: ['^fix', 'fix']

documentation:
  - head-branch: ['^docs', 'docs', '^doc', 'doc']

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**'
          - 'public/**'
          - 'index.html'
          - 'vite.config.ts'
          - 'tsconfig*.json'

backend:
  - changed-files:
      - any-glob-to-any-file:
          - 'src-tauri/**'

i18n:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/i18n/**'
          - 'src-tauri/src/i18n.rs'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'pnpm-lock.yaml'
          - 'src-tauri/Cargo.toml'
          - 'src-tauri/Cargo.lock'

github_actions:
    - changed-files:
        - any-glob-to-any-file:
            - '.github/workflows/**'
