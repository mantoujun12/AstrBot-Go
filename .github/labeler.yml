frontend:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**'

backend:
  - changed-files:
      - any-glob-to-any-file:
          - 'src-tauri/**'

i18n:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/i18n/**'
          - 'src-tauri/src/i18n.rs'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'pnpm-lock.yaml'
          - 'src-tauri/Cargo.toml'
          - 'src-tauri/Cargo.lock'
